<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JavaScript Quiz App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="quiz-wrapper">
    <div class="quiz-card" id="quiz-card">
      <div id="quiz-screen">
        <div class="quiz-header">
          <div class="title">Quick Quiz</div>
          <div class="pill">JavaScript Practice</div>
        </div>

        <div class="score-display">
          <span id="progress-text">Question 1 / 5</span>
          <span id="score-text">Score: 0 / 5</span>
          <span id="timer-text" class="timer-text timer-safe">⏱ 15s</span>
        </div>
        <div class="score-display">
          <span id="high-score-text" class="high-score">Best: 0 / 0 (0%)</span>
        </div>

        <div class="progress-bar-outer">
          <div class="progress-bar-inner" id="progress-bar"></div>
        </div>

        <div class="question" id="question-text">
          <!-- Question goes here -->
        </div>

        <div class="options" id="options-container">
          <!-- Options go here -->
        </div>

        <div class="feedback" id="feedback">
          <!-- Instant feedback goes here -->
        </div>

        <div class="actions">
          <button class="btn btn-secondary" id="restart-btn" type="button" style="display:none;">
            ↻ Restart
          </button>
          <button class="btn btn-primary" id="next-btn" type="button" disabled>
            Next ▶
          </button>
        </div>
      </div>

      <div id="result-screen" style="display:none;">
        <div class="result-card">
          <div class="result-title">Quiz Finished!</div>
          <div id="result-badge" class="badge badge-great">Awesome</div>
          <div class="result-score">
            <span id="final-score">0</span>/<span id="total-questions">0</span>
          </div>
          <div class="result-message" id="result-message">
            <!-- Result message -->
          </div>

          <div class="review-title">Review your answers</div>
          <div id="review-container" class="review-container">
            <!-- Review items -->
          </div>

          <button class="btn btn-primary" id="play-again-btn" type="button">
            ↻ Play Again
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- External JS -->
  <script src="script.js"></script>
</body>
</html>
